name: Android APK

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Add empty private configuration
        run: |
          mkdir -p app/src/main/assets
          printf '{}' > app/src/main/assets/private_config.json
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: CyberIPTV-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-tools/
